name: Update golangci-lint

on:
  schedule:
    # Check weekly on Monday, offset from the hour to reduce schedule contention.
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: latest
        name: Check latest stable release
        run: |
          set -euo pipefail
          version=$(curl -fsSL https://api.github.com/repos/golangci/golangci-lint/releases/latest | jq -r .tag_name)
          if [[ ! "$version" =~ ^v2\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected golangci-lint release tag: $version" >&2
            exit 1
          fi
          if [[ "$version" != "$(cat .golangci-version)" ]]; then
            printf '%s\n' "$version" > .golangci-version
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate candidate version
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.latest.outputs.version }}

      - name: Require CI-triggering token
        env:
          UPDATE_TOKEN: ${{ secrets.GOLANGCI_LINT_UPDATE_TOKEN }}
        run: |
          if [[ -z "$UPDATE_TOKEN" ]]; then
            echo "::error::GOLANGCI_LINT_UPDATE_TOKEN repository secret is required"
            exit 1
          fi

      - name: Create update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GOLANGCI_LINT_UPDATE_TOKEN }}
          commit-message: "chore(deps): update golangci-lint"
          branch: chore/update-golangci-lint
          delete-branch: true
          title: "chore(deps): update golangci-lint"
          body: "Updates the shared golangci-lint version to the latest stable v2 release."
          labels: dependencies