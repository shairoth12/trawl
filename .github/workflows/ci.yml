name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -v -race ./...

  devcontainer-go-version:
    name: Devcontainer Go version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check devcontainer Go >= go.mod
        run: |
          mod=$(awk '$1 == "go" { print $2 }' go.mod | cut -d. -f1,2)
          img=$(sed -nE 's#^FROM mcr\.microsoft\.com/devcontainers/go:([0-9]+\.[0-9]+).*#\1#p' .devcontainer/Dockerfile)
          if [[ -z "$img" ]]; then
            echo "::error file=.devcontainer/Dockerfile::base image must pin a Go minor version (e.g. go:${mod}-bookworm)"
            exit 1
          fi
          if [[ "$(printf '%s\n%s\n' "$mod" "$img" | sort -V | head -1)" != "$mod" ]]; then
            echo "::error file=.devcontainer/Dockerfile::devcontainer Go $img is older than go.mod Go $mod"
            exit 1
          fi
          echo "OK: devcontainer Go $img >= go.mod Go $mod"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - id: golangci-version
        run: echo "version=$(cat .golangci-version)" >> "$GITHUB_OUTPUT"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci-version.outputs.version }}

  release-validate:
    name: Release validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history is required for GoReleaser changelog generation.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate .goreleaser.yaml
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: check

      - name: Snapshot build (current platform)
        # Builds only the binary for the runner's OS/arch to catch compile errors
        # without the cost of full cross-compilation on every PR.
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: build --snapshot --single-target --clean
